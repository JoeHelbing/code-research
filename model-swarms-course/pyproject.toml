[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "model-swarms-course"
version = "0.1.0"
description = "Engineering-grade notebook course for Model Swarms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "safetensors>=0.6",
]

[dependency-groups]
heavy = [
  "torch>=2.8",
]

dev = [
  "ipykernel>=6.30",
  "jupyter>=1.1",
  "nbformat>=5.10",
  "pyright>=1.1.408",
  "pytest>=8.4",
  "ruff>=0.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_swarms_course"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
